# Navigate to sport section, then open profile menu
# Tests for overlay conflicts when profile overlays a sport screen.
appId: ${APP_ID}

---
- launchApp

- extendedWaitUntil:
    visible: ".*"
    timeout: 5000

- takeScreenshot: before_sport_navigation

# Navigate to sport section
- tapOn:
    text: "Sport"
    optional: true

- tapOn:
    text: "Sports"
    optional: true

- takeScreenshot: sport_screen

# Now open profile menu to test for overlay bug
- tapOn:
    text: "Profile"
    optional: true

- tapOn:
    text: "Account"
    optional: true

- takeScreenshot: profile_over_sport
